[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showErrorLinks = false

[server]
maxUploadSize = 10
maxMessageSize = 60
# Polling preserves local auto-reload without introspecting every lazily loaded
# transformers module, which otherwise produces optional torchvision tracebacks.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#315EFB"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1633"
font = "sans serif"
