name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q app scripts tests

      - name: Validate benchmark integrity
        run: python scripts/validate_benchmark.py

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ github.run_number }}
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
