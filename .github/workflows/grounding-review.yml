name: JobCopilot Grounding Review Preparation

on:
  workflow_dispatch:
    inputs:
      case_count:
        description: Number of generated emails to prepare for human claim review
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "50"
      execution_mode:
        description: Isolated grounding uses frozen annotations and no Anthropic credits
        required: true
        default: isolated
        type: choice
        options:
          - isolated
          - end-to-end

permissions:
  contents: read

concurrency:
  group: jobcopilot-grounding-review
  cancel-in-progress: false

jobs:
  prepare-grounding-review:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROFILE_MEMORIES_FILE: data/profile_memories.atomic.json
      ALLOW_TRUSTED_FAISS_DESERIALIZATION: "false"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-v1

      - name: Verify Anthropic secret for end-to-end mode
        if: ${{ inputs.execution_mode == 'end-to-end' }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate benchmark integrity
        run: python scripts/validate_benchmark.py

      - name: Prepare generated-email review records
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ inputs.case_count }}" = "50" ]; then
            LIMIT=0
          else
            LIMIT="${{ inputs.case_count }}"
          fi

          python scripts/prepare_email_grounding_review.py \
            --dataset evaluation/job_offers.v1.jsonl \
            --memories data/profile_memories.atomic.json \
            --output evaluation/results/email_grounding_review.jsonl \
            --errors-output evaluation/results/email_grounding_errors.jsonl \
            --manifest-output evaluation/results/email_grounding_manifest.json \
            --sampling stratified \
            --execution-mode "${{ inputs.execution_mode }}" \
            --limit "$LIMIT"

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          review_path = Path("evaluation/results/email_grounding_review.jsonl")
          manifest_path = Path("evaluation/results/email_grounding_manifest.json")
          error_path = Path("evaluation/results/email_grounding_errors.jsonl")

          records = []
          if review_path.exists():
              records = [
                  json.loads(line)
                  for line in review_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
          manifest = (
              json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest_path.exists()
              else {"status": "missing", "completed_jobs": len(records), "failed_jobs": 0}
          )
          errors = []
          if error_path.exists():
              errors = [
                  json.loads(line)
                  for line in error_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          categories = Counter(record.get("category", "unknown") for record in records)
          variants = Counter(record.get("composition_variant", "unknown") for record in records)
          proposed_claim_count = sum(
              len(record.get("proposed_claims", [])) for record in records
          )
          evidence_selections = {
              tuple(record.get("selected_memory_ids", [])) for record in records
          }
          selected_ids = {
              memory_id
              for record in records
              for memory_id in record.get("selected_memory_ids", [])
          }
          lines = [
              "# JobCopilot Generated-Email Grounding Review",
              "",
              f"- Status: `{manifest.get('status', 'unknown')}`",
              f"- Execution mode: `{manifest.get('execution_mode', '${{ inputs.execution_mode }}')}`",
              f"- Requested records: {manifest.get('requested_jobs', '${{ inputs.case_count }}')}",
              f"- Review records prepared: {len(records)}",
              f"- Failed records: {len(errors)}",
              f"- Role families covered: {len(categories)}",
              f"- Unique evidence selections: {len(evidence_selections)}",
              f"- Unique atomic memories selected: {len(selected_ids)}",
              f"- Safe composition variants used: {len(variants)}",
              f"- Machine-proposed evidence claims: {proposed_claim_count}",
              "- Candidate profile: fictional public atomic profile",
              "- Isolated mode: frozen structured job annotations, local retrieval, deterministic selection and deterministic composition; no Anthropic API call",
              "- End-to-end mode: complete product graph and Anthropic billing required",
              "- Review status: `pending independent human claim-level annotation`",
              "",
          ]
          if errors:
              first = errors[0]
              lines.extend([
                  "## Failure checkpoint",
                  "",
                  f"- Failed job: `{first.get('job_id', 'unknown')}`",
                  f"- Error type: `{first.get('error_type', 'unknown')}`",
                  f"- Error: {first.get('error_message', 'unknown')}",
                  "- Completed records remain available in the artifact.",
                  "",
              ])
          lines.extend([
              "This workflow does not calculate an unsupported-claim rate automatically.",
              "The generated `proposed_claims` are an audit aid, not ground-truth labels.",
              "",
              "## Category coverage",
          ])
          lines.extend(f"- {name}: {count}" for name, count in sorted(categories.items()))
          lines.extend(["", "## Safe composition variants"])
          lines.extend(f"- {name}: {count}" for name, count in sorted(variants.items()))
          lines.extend([
              "",
              "Download the JSONL artifact, complete the `claims` arrays, and then run `scripts/summarize_email_grounding_review.py`.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload grounding review checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobcopilot-grounding-review-${{ github.run_number }}-${{ inputs.case_count }}-cases-${{ inputs.execution_mode }}
          path: |
            evaluation/results/email_grounding_review.jsonl
            evaluation/results/email_grounding_manifest.json
            evaluation/results/email_grounding_errors.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Fail incomplete end-to-end run after preserving checkpoint
        if: ${{ steps.prepare.outcome == 'failure' }}
        run: |
          echo "::error::Grounding preparation was incomplete. Partial records and the error manifest were uploaded."
          exit 1
