name: JobCopilot Retrieval Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/retrieval.py"
      - "app/services/evaluation_observability.py"
      - "evaluation/retrieval_cases.v1.jsonl"
      - "scripts/evaluate_retrieval.py"
      - "scripts/summarize_retrieval_report.py"
      - "requirements.txt"
      - ".github/workflows/retrieval-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: jobcopilot-retrieval-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROFILE_MEMORIES_FILE: data/profile_memories.example.json
      ALLOW_TRUSTED_FAISS_DESERIALIZATION: "false"
      RETRIEVAL_STRATEGY: "hybrid"
      RETRIEVAL_RERANKER_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-premium-retrieval-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate benchmark integrity
        run: python scripts/validate_benchmark.py

      - name: Run comparative retrieval benchmark
        run: |
          python scripts/evaluate_retrieval.py \
            --dataset evaluation/retrieval_cases.v1.jsonl \
            --output evaluation/results/retrieval_report.json \
            --k 5 \
            --strategies dense hybrid hybrid_rerank

      - name: Build compact publishable summary
        run: |
          python scripts/summarize_retrieval_report.py \
            --input evaluation/results/retrieval_report.json \
            --output evaluation/results/retrieval_summary.json

      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("evaluation/results/retrieval_summary.json").read_text(encoding="utf-8")
          )
          labels = {
              "dense": "Dense FAISS",
              "hybrid": "FAISS + BM25 + RRF",
              "hybrid_rerank": "Hybrid + cross-encoder",
          }
          lines = [
              "# JobCopilot Retrieval Benchmark",
              "",
              f"- Cases evaluated: {summary.get('number_of_cases', 0)}",
              "- Dense model: `sentence-transformers/all-MiniLM-L6-v2`",
              "- Reranker: `cross-encoder/ms-marco-MiniLM-L-6-v2`",
              "- Benchmark type: synthetic engineering regression",
              f"- Latency scope: `{summary.get('latency_scope', 'unknown')}`",
              "",
              "| Strategy | MRR | Recall@1 | Recall@3 | Recall@5 | NDCG@5 | Mean ms | P95 ms |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for name, aggregate in summary.get("strategies", {}).items():
              lines.append(
                  "| "
                  + labels.get(name, name)
                  + f" | {aggregate.get('mrr', 0.0):.4f}"
                  + f" | {aggregate.get('recall@1', 0.0):.4f}"
                  + f" | {aggregate.get('recall@3', 0.0):.4f}"
                  + f" | {aggregate.get('recall@5', 0.0):.4f}"
                  + f" | {aggregate.get('ndcg@5', 0.0):.4f}"
                  + f" | {aggregate.get('mean_latency_ms', 0.0):.1f}"
                  + f" | {aggregate.get('p95_latency_ms', 0.0):.1f} |"
              )
          rerank_delta = summary.get("delta_vs_dense", {}).get("hybrid_rerank", {})
          if rerank_delta:
              lines.extend(
                  [
                      "",
                      "## Hybrid + cross-encoder delta vs dense",
                      f"- MRR: {rerank_delta.get('mrr', 0.0):+.4f}",
                      f"- Recall@5: {rerank_delta.get('recall@5', 0.0):+.4f}",
                      f"- NDCG@5: {rerank_delta.get('ndcg@5', 0.0):+.4f}",
                      f"- Mean warm latency: {rerank_delta.get('mean_latency_ms', 0.0):+.1f} ms",
                      f"- P95 warm latency: {rerank_delta.get('p95_latency_ms', 0.0):+.1f} ms",
                  ]
              )
          lines.extend(
              [
                  "",
                  "All strategies are evaluated on the same fictional public profile and labeled retrieval cases.",
                  "Latency is measured after one strategy-specific warm-up, so cold model-loading time is excluded.",
                  "These are retrieval-regression metrics, not recruiter or hiring outcomes.",
                  "The complete case-level report and compact summary are available in the workflow artifact.",
              ]
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload retrieval reports
        uses: actions/upload-artifact@v4
        with:
          name: jobcopilot-retrieval-${{ github.run_number }}
          path: |
            evaluation/results/retrieval_report.json
            evaluation/results/retrieval_summary.json
          if-no-files-found: error
          retention-days: 30
