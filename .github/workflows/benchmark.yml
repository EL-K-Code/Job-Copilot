name: JobCopilot Benchmark

on:
  workflow_dispatch:
    inputs:
      case_count:
        description: Benchmark suite to run
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "50"

permissions:
  contents: read

concurrency:
  group: jobcopilot-benchmark
  cancel-in-progress: false

jobs:
  extraction-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify Anthropic secret
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY. Add it under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate benchmark integrity
        run: python scripts/validate_benchmark.py

      - name: Run extraction benchmark
        shell: bash
        run: |
          if [ "${{ inputs.case_count }}" = "50" ]; then
            python scripts/evaluate_job_extraction.py \
              --dataset evaluation/job_offers.v1.jsonl \
              --benchmark-version 1.0.0
          else
            python scripts/evaluate_job_extraction.py \
              --dataset evaluation/job_offers.smoke.v1.jsonl \
              --benchmark-version smoke-1.0.0
          fi

      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("evaluation/results/job_extraction_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          aggregate = report.get("aggregate", {})

          lines = [
              "# JobCopilot Benchmark",
              "",
              f"- Cases evaluated: {aggregate.get('number_of_cases', 0)}",
              f"- Dataset: `{report.get('dataset', 'unknown')}`",
              f"- Model: `{report.get('model', 'unknown')}`",
              f"- Normalized scalar accuracy: {aggregate.get('mean_scalar_accuracy', 0.0):.4f}",
              f"- Strict scalar accuracy: {aggregate.get('mean_strict_scalar_accuracy', 0.0):.4f}",
              f"- Closed-label list F1: {aggregate.get('mean_macro_label_list_f1', 0.0):.4f}",
              f"- Mission-summary exact F1 (diagnostic): {aggregate.get('mean_summary_exact_f1', 0.0):.4f}",
              f"- Dataset version: `{report.get('benchmark_version', 'unknown')}`",
              f"- Evaluation protocol: `{report.get('evaluation_protocol_version', 'unknown')}`",
              "",
              "Contract type is reported with a broad normalized category score and a separate strict-match diagnostic.",
              "Mission summaries are excluded from closed-label macro F1 because valid paraphrases may differ lexically.",
              "`key_highlights_for_candidate` is a generated recommendation field and is excluded from extraction F1.",
              "The complete case-level report is available in the workflow artifact.",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: jobcopilot-benchmark-${{ github.run_number }}-${{ inputs.case_count }}-cases
          path: evaluation/results/job_extraction_report.json
          if-no-files-found: error
          retention-days: 30
