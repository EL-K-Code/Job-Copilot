name: JobCopilot Model Routing Benchmark

on:
  workflow_dispatch:
    inputs:
      case_count:
        description: Versioned extraction suite to compare
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "50"
      llm_provider:
        description: Primary LLM provider
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic

permissions:
  contents: read

concurrency:
  group: jobcopilot-model-routing-benchmark
  cancel-in-progress: false

jobs:
  compare-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LLM_PROVIDER: ${{ inputs.llm_provider }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional. If absent, cost stays unavailable rather than using stale hard-coded prices.
      LLM_PRICING_JSON: ${{ secrets.LLM_PRICING_JSON }}
      LLM_PRICING_VERSION: ${{ vars.LLM_PRICING_VERSION }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify selected provider secret
        shell: bash
        run: |
          if [ "$LLM_PROVIDER" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY."
            exit 1
          fi
          if [ "$LLM_PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Configure optional cross-provider fallback
        shell: bash
        run: |
          if [ "$LLM_PROVIDER" = "openai" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "LLM_FALLBACK_PROVIDER=anthropic" >> "$GITHUB_ENV"
          elif [ "$LLM_PROVIDER" = "anthropic" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "LLM_FALLBACK_PROVIDER=openai" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate benchmark integrity
        run: python scripts/validate_benchmark.py

      - name: Select benchmark dataset
        shell: bash
        run: |
          if [ "${{ inputs.case_count }}" = "50" ]; then
            echo "ROUTING_DATASET=evaluation/job_offers.v1.jsonl" >> "$GITHUB_ENV"
            echo "ROUTING_BENCHMARK_VERSION=1.0.0" >> "$GITHUB_ENV"
          else
            echo "ROUTING_DATASET=evaluation/job_offers.smoke.v1.jsonl" >> "$GITHUB_ENV"
            echo "ROUTING_BENCHMARK_VERSION=smoke-1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Run adaptive routing
        shell: bash
        run: |
          LLM_ROUTING_MODE=adaptive python scripts/evaluate_job_extraction.py \
            --dataset "$ROUTING_DATASET" \
            --benchmark-version "$ROUTING_BENCHMARK_VERSION" \
            --output evaluation/results/job_extraction_adaptive.json

      - name: Run single-model baseline
        shell: bash
        run: |
          LLM_ROUTING_MODE=single python scripts/evaluate_job_extraction.py \
            --dataset "$ROUTING_DATASET" \
            --benchmark-version "$ROUTING_BENCHMARK_VERSION" \
            --output evaluation/results/job_extraction_single.json

      - name: Compare routing modes
        run: |
          python scripts/compare_model_routing_reports.py \
            --adaptive evaluation/results/job_extraction_adaptive.json \
            --single evaluation/results/job_extraction_single.json \
            --output evaluation/results/model_routing_comparison.json

      - name: Publish comparison summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          comparison = json.loads(
              Path("evaluation/results/model_routing_comparison.json").read_text(encoding="utf-8")
          )
          quality = comparison.get("quality", {})
          runtime = comparison.get("runtime", {})

          def fmt_delta(section, metric, digits=4, suffix=""):
              value = section.get(metric, {}).get("delta")
              if value is None:
                  return "unavailable"
              return f"{value:+.{digits}f}{suffix}"

          lines = [
              "# JobCopilot Model Routing Benchmark",
              "",
              f"- Cases: `${{ inputs.case_count }}`",
              f"- Primary provider: `${{ inputs.llm_provider }}`",
              f"- Dataset SHA: `{comparison.get('dataset_sha256', 'unknown')}`",
              f"- Evaluation protocol: `{comparison.get('evaluation_protocol_version', 'unknown')}`",
              "",
              "## Adaptive minus single-model baseline",
              f"- Normalized scalar accuracy delta: {fmt_delta(quality, 'mean_scalar_accuracy')}",
              f"- Closed-label list F1 delta: {fmt_delta(quality, 'mean_macro_label_list_f1')}",
              f"- Mean successful-call latency delta: {fmt_delta(runtime, 'mean_success_latency_ms', 1, ' ms')}",
              f"- Total LLM wall-time delta: {fmt_delta(runtime, 'total_duration_ms', 1, ' ms')}",
              f"- Estimated cost delta: {fmt_delta(runtime, 'estimated_cost_usd', 6, ' USD')}",
              f"- Adaptive escalation rate: {runtime.get('escalation_rate', {}).get('adaptive', 'unavailable')}",
              "",
              "Cost is reported only when token usage is available and an explicit versioned pricing catalog covers the models used.",
              "These are synthetic engineering benchmark results, not recruiter or hiring outcomes.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload routing benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: jobcopilot-model-routing-${{ github.run_number }}-${{ inputs.case_count }}-cases-${{ inputs.llm_provider }}
          path: |
            evaluation/results/job_extraction_adaptive.json
            evaluation/results/job_extraction_single.json
            evaluation/results/model_routing_comparison.json
          if-no-files-found: error
          retention-days: 30
